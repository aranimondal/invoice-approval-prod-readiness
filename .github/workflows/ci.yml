name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: ./mvnw -B -q -DskipTests install

      # Structural rules get their own step so a violation is visible in the PR checks
      # rather than buried in the unit-test count. See docs/architecture/as-built.md.
      - name: Architecture rules (ArchUnit)
        run: ./mvnw -B -pl invoice-domain test -Dtest=DomainArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Unit and API contract tests
        run: ./mvnw -B verify

      - name: Diagrams match their .mmd sources
        working-directory: .
        run: python3 scripts/diagrams/sync_diagrams.py --check

      - name: CI baseline numbers
        working-directory: .
        run: python3 scripts/metrics/ci_baseline.py ops/pipeline/run-timings.csv

  end-to-end:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright starts the Spring Boot app)
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

  # Most of the team develops on Windows; prove the wrapper and the e2e config work there too.
  windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and test with mvnw.cmd
        run: .\backend\mvnw.cmd -B -f backend\pom.xml verify
      - name: End-to-end tests on Windows
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test
